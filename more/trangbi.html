<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang Bị</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
background:#111;
color:white;
font-family:Arial;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
background:#000;
padding:10px;
text-align:center;
border-bottom:2px solid gold;
}

.stats{
display:flex;
justify-content:space-around;
padding:10px;
}

.slot{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.slot img{
width:70px;
}

button{
margin:10px;
padding:12px;
border:none;
border-radius:10px;
}

.equip{background:#27ae60;color:white;}
.close{background:#e74c3c;color:white;}
</style>
</head>

<body>

<div class="header">🎒 TRANG BỊ PET</div>

<div class="stats">
<div>💰 <span id="gold">0</span></div>
<div>⚔️ ATK: <span id="atk">20</span></div>
</div>

<div class="slot">
<img src="../img/vukhi.png">
</div>

<button class="equip" onclick="toggleEquip()">Trang bị / Gỡ</button>
<button class="close" onclick="closePage()">Đóng</button>

<script>
let equipped=false;

/* sync data */
window.addEventListener("message",e=>{
const d=e.data;

if(d.type==="sync"){
document.getElementById("gold").textContent=d.gold;
document.getElementById("atk").textContent=d.atk;
equipped=d.hasWeapon;
}
});

/* toggle */
function toggleEquip(){
equipped=!equipped;

parent.postMessage({
type:"equip",
hasWeapon:equipped
},"*");
}

/* close */
function closePage(){
parent.postMessage({type:"close"},"*");
}
</script>

</body>
</html>
