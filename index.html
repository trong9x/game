<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>🔥 Hỏa Long Mobile - Official Version</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --gold: #ffd700; --red: #ff4444; --blue: #3498db; }
        * { margin:0; padding:0; box-sizing:border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { overflow:hidden; background:#111; font-family: 'Segoe UI', Arial; color: white; touch-action: none; }

        /* MAP */
        #map {
            position:absolute; width:3000px; height:3000px;
            background: url('img/co.png') repeat;
            background-size: 100px 100px;
            will-change: transform;
        }

        /* ENTITY BASE */
        .entity {
            position:absolute; background-repeat:no-repeat; background-size:contain;
            background-position:bottom center; image-rendering:pixelated;
            transition: filter 0.2s;
        }

        #player { width:70px; height:80px; background-image:url('img/char1.png'); z-index: 100; }
        #pet { width:60px; height:60px; background-image:url('img/smile.png'); }
        .mob { width:80px; height:90px; background-image:url('img/boss.png'); }
        .npc-char { width:70px; height:80px; }
        
        /* HIỆU ỨNG SKILL */
        #skill-effect {
            position: absolute; width: 120px; height: 120px;
            background: url('img/kill.png') no-repeat center;
            background-size: contain; display: none; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%);
        }

        /* JOYSTICK VIRTUAL */
        #joystick-zone {
            position: fixed; bottom: 50px; left: 50px; width: 120px; height: 120px;
            background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 2000;
            border: 2px solid rgba(255,255,255,0.2);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255,255,255,0.4); border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* MOBILE BUTTONS */
        #mobile-btns {
            position:fixed; bottom:30px; right:30px; z-index:2000; 
            display:grid; grid-template-columns: repeat(2, 80px); gap:15px;
        }
        .btn-action {
            width:80px; height:80px; border-radius:50%; color:white; 
            font-weight:bold; border:3px solid rgba(255,255,255,0.6); cursor:pointer;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-size: 12px; text-shadow: 1px 1px 2px black;
        }
        .btn-big { grid-column: span 2; width: 100%; height: 60px; border-radius: 30px; }

        /* HUD & STATUS */
        #hud {
            position:fixed; top:20px; left:20px; background:rgba(0,0,0,0.7);
            border:2px solid var(--gold); padding:10px; border-radius:10px; z-index:1000;
        }
        .bar-container { width: 150px; height: 12px; background: #333; border: 1px solid #fff; border-radius: 6px; margin: 5px 0; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.3s ease; }

        /* POPUP & UI */
        #respawn-screen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10000;
        }
        .damage-text {
            position: absolute; font-weight: bold; font-size: 24px; pointer-events: none;
            animation: floatUp 0.8s ease-out forwards; z-index: 10000;
        }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }
        
        /* Inventory optimized */
        #inventory-ui {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #222; border: 3px solid var(--gold); padding: 20px;
            display: none; z-index: 3000; border-radius: 15px; min-width: 280px;
        }
    </style>
</head>
<body>

<div id="hud">
    <div style="color:gold; font-weight:bold; margin-bottom:5px;">💰 <span id="gold-txt">0</span></div>
    <div class="bar-container"><div id="hp-fill" class="bar-fill" style="background:var(--red); width:100%;"></div></div>
    <div class="bar-container"><div id="mp-fill" class="bar-fill" style="background:var(--blue); width:100%;"></div></div>
</div>

<div id="joystick-zone"><div id="joystick-stick"></div></div>

<div id="mobile-btns">
    <div class="btn-action" style="background:rgba(231, 76, 60, 0.7);" onclick="pickFruit()">HÁI QUẢ</div>
    <div class="btn-action" style="background:rgba(46, 204, 113, 0.7);" onclick="normalAttack()">ĐÁNH</div>
    <div class="btn-action btn-big" style="background:linear-gradient(to right, #f39c12, #e67e22);" onclick="attack()">TUYỆT CHIÊU (20 MP)</div>
</div>

<div id="map">
    <div id="objects"></div>
    <div id="skill-effect"></div>
    <div id="player" class="entity"></div>
    <div id="pet" class="entity"></div>
</div>

<button onclick="toggleInv()" style="position:fixed; bottom:30px; left:30px; z-index:2000; padding:12px 20px; background:var(--gold); border-radius:10px; font-weight:bold;">RƯƠNG ĐỒ</button>

<div id="inventory-ui">
    <h3 style="margin-bottom:15px; color:var(--gold)">HÀNH TRANG</h3>
    <div id="slots-container"></div>
    <button onclick="toggleInv()" style="margin-top:15px; width:100%; padding:10px; background:#444; color:white; border:none;">ĐÓNG</button>
</div>

<div id="respawn-screen">
    <h1 style="color:var(--red); font-size: 40px;">BẠN ĐÃ KIỆT SỨC</h1>
    <p>Đang hồi phục sau...</p>
    <div id="respawn-timer" style="font-size: 60px; color:white; font-weight:bold;">5</div>
</div>

<script>
const state = { 
    px: 1500, py: 1500, 
    petX: 1450, petY: 1500,
    gold: 0, atk: 20, 
    hp: 100, maxHp: 100,
    mp: 100, maxMp: 100,
    isDead: false,
    inventory: [], 
    keys: {},
    joy: { x: 0, y: 0, active: false }
};

const mobs = [];
const trees = [];
const objectsLayer = document.getElementById("objects");

// --- 1. KHỞI TẠO THẾ GIỚI ---
for(let i=0; i<30; i++) {
    const x = Math.random() * 2800;
    const y = Math.random() * 2800;
    const tree = document.createElement("div");
    tree.className = "entity";
    tree.style.cssText = `background-image:url('img/cay.png'); left:${x}px; top:${y}px; width:100px; height:120px;`;
    objectsLayer.appendChild(tree);
    trees.push({ x, y, el: tree, hasFruit: true });
}

function spawnMob() {
    const x = Math.random()*2500 + 200;
    const y = Math.random()*2500 + 200;
    const el = document.createElement("div");
    el.className = "entity mob";
    el.innerHTML = `<div style="position:absolute; top:-10px; width:100%; height:5px; background:#333;"><div class="m-hp" style="width:100%; height:100%; background:red;"></div></div>`;
    el.style.left = x + "px"; el.style.top = y + "px";
    objectsLayer.appendChild(el);
    mobs.push({ el, hpEl: el.querySelector('.m-hp'), x, y, hp: 100, alive: true });
}
for(let i=0; i<8; i++) spawnMob();

// --- 2. HỆ THỐNG ĐIỀU KHIỂN JOYSTICK ---
const stick = document.getElementById('joystick-stick');
const zone = document.getElementById('joystick-zone');

zone.addEventListener('touchstart', (e) => state.joy.active = true);
zone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = zone.getBoundingClientRect();
    const centerX = rect.left + rect.width/2;
    const centerY = rect.top + rect.height/2;
    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const limit = 40;
    
    if(dist > limit) { dx *= limit/dist; dy *= limit/dist; }
    stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    state.joy.x = dx / limit;
    state.joy.y = dy / limit;
});
zone.addEventListener('touchend', () => {
    stick.style.transform = `translate(-50%, -50%)`;
    state.joy.x = 0; state.joy.y = 0;
});

// --- 3. CHIẾN ĐẤU & HIỆU ỨNG ---
function createDamageText(x, y, text, color) {
    const d = document.createElement("div");
    d.className = "damage-text";
    d.innerText = text;
    d.style.left = x + "px"; d.style.top = y + "px";
    d.style.color = color;
    objectsLayer.appendChild(d);
    setTimeout(() => d.remove(), 800);
}

function normalAttack() {
    if(state.isDead) return;
    performAttack(state.atk * 0.7, 100, "grayscale(1) brightness(1.5)");
}

function attack() {
    if(state.isDead || state.mp < 20) return;
    state.mp -= 20;
    performAttack(state.atk, 140, "none");
}

function performAttack(dmg, range, filter) {
    const eff = document.getElementById("skill-effect");
    eff.style.left = state.px + "px";
    eff.style.top = state.py + "px";
    eff.style.display = "block";
    eff.style.filter = filter;
    setTimeout(() => eff.style.display = "none", 200);

    mobs.forEach(m => {
        if(!m.alive) return;
        const d = Math.hypot(state.px - m.x, state.py - m.y);
        if(d < range) {
            m.hp -= dmg;
            m.hpEl.style.width = m.hp + "%";
            createDamageText(m.x, m.y - 20, `-${Math.floor(dmg)}`, "yellow");
            if(m.hp <= 0) killMob(m);
        }
    });
}

function killMob(m) {
    m.alive = false;
    m.el.style.opacity = "0";
    state.gold += 50;
    document.getElementById("gold-txt").innerText = state.gold;
    setTimeout(() => { m.el.remove(); spawnMob(); }, 1000);
}

function pickFruit() {
    trees.forEach(t => {
        const d = Math.hypot(state.px - t.x, state.py - t.y);
        if(d < 80 && t.hasFruit) {
            state.hp = Math.min(state.maxHp, state.hp + 20);
            createDamageText(state.px, state.py - 30, "+20 HP", "#2ecc71");
            t.hasFruit = false;
            t.el.style.filter = "sepia(1) brightness(0.5)";
            setTimeout(() => { t.hasFruit = true; t.el.style.filter = "none"; }, 10000);
        }
    });
}

// --- 4. VÒNG LẶP CHÍNH (GAME LOOP) ---
function update() {
    if(state.isDead) return requestAnimationFrame(update);

    let speed = 6;
    let dx = state.joy.x * speed;
    let dy = state.joy.y * speed;

    // Support Keyboard PC
    if(state.keys['w']) dy = -speed;
    if(state.keys['s']) dy = speed;
    if(state.keys['a']) dx = -speed;
    if(state.keys['d']) dx = speed;

    state.px += dx; state.py += dy;
    
    // Boundary check
    state.px = Math.max(0, Math.min(2950, state.px));
    state.py = Math.max(0, Math.min(2950, state.py));

    // Mana Recovery
    if(state.mp < state.maxMp) state.mp += 0.05;

    // AI Mobs & Damage
    mobs.forEach(m => {
        if(!m.alive) return;
        const d = Math.hypot(state.px - m.x, state.py - m.y);
        if(d < 300) {
            m.x += (state.px - m.x) * 0.02;
            m.y += (state.py - m.y) * 0.02;
        }
        if(d < 50) {
            state.hp -= 0.2;
            if(state.hp <= 0) triggerRespawn();
        }
        m.el.style.left = m.x + "px";
        m.el.style.top = m.y + "px";
        m.el.style.zIndex = Math.floor(m.y);
    });

    // Pet follow
    state.petX += (state.px - 50 - state.petX) * 0.08;
    state.petY += (state.py - 10 - state.petY) * 0.08;

    // Render Player & Camera
    const p = document.getElementById("player");
    const pet = document.getElementById("pet");
    p.style.left = state.px + "px"; p.style.top = state.py + "px";
    p.style.zIndex = Math.floor(state.py);
    pet.style.left = state.petX + "px"; pet.style.top = state.petY + "px";
    
    document.getElementById("hp-fill").style.width = state.hp + "%";
    document.getElementById("mp-fill").style.width = state.mp + "%";
    document.getElementById("map").style.transform = `translate(${innerWidth/2 - state.px}px, ${innerHeight/2 - state.py}px)`;

    requestAnimationFrame(update);
}

function triggerRespawn() {
    state.isDead = true;
    const screen = document.getElementById("respawn-screen");
    const timerTxt = document.getElementById("respawn-timer");
    screen.style.display = "flex";
    let count = 5;
    const interval = setInterval(() => {
        count--;
        timerTxt.innerText = count;
        if(count <= 0) {
            clearInterval(interval);
            state.hp = 100; state.mp = 100;
            state.px = 1500; state.py = 1500;
            state.isDead = false;
            screen.style.display = "none";
        }
    }, 1000);
}

function toggleInv() {
    const ui = document.getElementById("inventory-ui");
    ui.style.display = ui.style.display === "block" ? "none" : "block";
}

window.onkeydown = e => state.keys[e.key.toLowerCase()] = true;
window.onkeyup = e => state.keys[e.key.toLowerCase()] = false;

// Start
requestAnimationFrame(update);
</script>
</body>
</html>
