<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>RPG: Level Up System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <style>
        :root { --accent: #ffd700; --hp-red: #ff4757; --exp-blue: #2980b9; --ui-bg: rgba(0, 0, 0, 0.7); }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        
        #viewport { position: fixed; inset: 0; overflow: hidden; }
        #map { position: absolute; width: 2400px; height: 2400px; will-change: transform; }
        #grass { position: absolute; inset: 0; background: url('img/co.png') repeat; background-size: 120px 120px; image-rendering: pixelated; }

        .entity { position: absolute; transform-origin: bottom center; z-index: 10; }
        .char { width: 80px; height: 80px; background: center/contain no-repeat; transition: transform 0.1s; }
        .mob { width: 60px; height: 60px; background: url('img/smile.png') center/contain no-repeat; image-rendering: pixelated; }
        
        /* UI Top - Đã thêm thanh EXP */
        #ui-top { position: fixed; top: 15px; left: 15px; right: 15px; z-index: 1000; pointer-events: none; display: flex; flex-direction: column; gap: 8px; }
        .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .player-card { background: var(--ui-bg); padding: 10px 20px; border-radius: 15px; border-left: 5px solid var(--accent); pointer-events: auto; color: white; min-width: 180px; }
        .level-badge { color: var(--accent); font-weight: 900; font-size: 20px; margin-bottom: 2px; }
        
        .bar-container { width: 200px; height: 10px; background: #333; border-radius: 5px; margin-top: 5px; overflow: hidden; border: 1px solid #000; }
        #exp-fill { height: 100%; width: 0%; background: var(--exp-blue); transition: width 0.3s; }
        #hp-fill-ui { height: 100%; width: 100%; background: var(--hp-red); transition: width 0.3s; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; font-size: 12px; margin-top: 5px; color: #ddd; }

        /* Level Up Effect */
        #lvl-up-text { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); color: var(--accent); font-size: 50px; font-weight: 900; text-shadow: 0 0 20px #000; display: none; z-index: 3000; animation: lvlUpAnim 1.5s forwards; }
        @keyframes lvlUpAnim { 0% { opacity:0; transform: translate(-50%, 0); } 20% { opacity:1; } 80% { opacity:1; } 100% { opacity:0; transform: translate(-50%, -100px); } }

        /* Giữ nguyên các style cũ của bạn */
        #weapon-hand { position: absolute; width: 50px; height: 50px; background: url('img/vukhi.png') center/contain no-repeat; top: 10px; right: -15px; display: none; }
        .dmg-popup { position: absolute; color: #fff; font-weight: 900; font-size: 22px; text-shadow: 2px 2px #000; pointer-events: none; z-index: 9999; animation: floatUp 0.6s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }
        .swing-anim { animation: swing 0.15s ease-in-out; }
        @keyframes swing { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-95deg); } }
        
        #mobileUI { position: fixed; inset: 0; pointer-events: none; z-index: 1500; }
        #joy-container { position: absolute; left: 40px; bottom: 40px; width: 130px; height: 130px; pointer-events: auto; }
        #joy { width: 100%; height: 100%; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); position: relative; }
        #stick { position: absolute; width: 50px; height: 50px; background: #fff; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        #action-container { position: absolute; right: 30px; bottom: 30px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
        .btn-mobile { width: 85px; height: 85px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; background: var(--ui-bg); color: white; border: 3px solid rgba(255,255,255,0.2); }
        #btnAttack { width: 105px; height: 105px; background: rgba(231, 76, 60, 0.6); }

        #shopUI { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 2000; align-items: center; justify-content: center; }
        .shop-content { width: 320px; background: #2c3e50; border-radius: 20px; padding: 25px; color: white; text-align: center; border: 2px solid var(--accent); }
    </style>
</head>
<body>

<div id="lvl-up-text">LEVEL UP!</div>

<div id="ui-top">
    <div class="top-row">
        <div class="player-card">
            <div class="level-badge">LV. <span id="lvl-val">1</span></div>
            <div style="font-size: 11px;">HP</div>
            <div class="bar-container"><div id="hp-fill-ui"></div></div>
            <div style="font-size: 11px; margin-top: 4px;">EXP</div>
            <div class="bar-container"><div id="exp-fill"></div></div>
            <div class="stats-grid">
                <span>⚔️ Công: <b id="dmg-val">20</b></span>
                <span>💰 Vàng: <b id="gold-val">0</b></span>
            </div>
        </div>
        <div style="background: var(--ui-bg); color: var(--accent); padding: 10px 20px; border-radius: 50px; font-weight: bold; height: fit-content;">
            👾 DIỆT: <span id="kill-count">0</span>
        </div>
    </div>
</div>

<div id="viewport">
    <div id="map">
        <div id="grass"></div>
        <div id="shopHouse" class="entity" data-collidable style="left: 950px; top: 500px; width: 220px; height: 220px; background: url('img/shop.png') center/contain no-repeat;"></div>
        <div class="entity char" id="player" style="left:520px;top:500px;background-image:url('img/char1.png')">
            <div id="weapon-hand"></div>
        </div>
        <div class="entity char" id="npcBlacksmith" style="left:920px;top:680px;background-image:url('img/char3.png')"></div>
        <div id="mobs-layer"></div>
    </div>
</div>

<div id="shopUI">
    <div class="shop-content">
        <h3>⚒️ TIỆM RÈN</h3>
        <p style="font-size: 14px; margin: 10px 0; color: #bdc3c7;">Nâng cấp kiếm để tăng mạnh sát thương cơ bản!</p>
        <button onclick="buySword()" style="width:100%; padding:15px; background:#27ae60; border:none; color:white; border-radius:10px; font-weight:bold;">MUA KIẾM THẦN (200💰)</button>
        <button onclick="shopUI.style.display='none'" style="background:none; border:none; color:#888; margin-top:10px;">Đóng</button>
    </div>
</div>

<div id="mobileUI">
    <div id="joy-container"><div id="joy"><div id="stick"></div></div></div>
    <div id="action-container">
        <div id="btnAttack" class="btn-mobile">⚔️</div>
        <div id="btnAction" class="btn-mobile">💬</div>
    </div>
</div>

<script>
    const player = document.getElementById("player"), map = document.getElementById("map");
    const mobLayer = document.getElementById("mobs-layer"), weaponHand = document.getElementById("weapon-hand");
    
    // Stats khởi đầu
    let px = 520, py = 500, gold = 100, kills = 0;
    let level = 1, exp = 0, expNext = 100;
    let baseDmg = 20, weaponDmg = 0;
    let maxHP = 100, currentHP = 100;

    let keys = { up: false, down: false, left: false, right: false };
    let mobs = [];

    function updateUI() {
        document.getElementById("lvl-val").textContent = level;
        document.getElementById("dmg-val").textContent = baseDmg + weaponDmg;
        document.getElementById("gold-val").textContent = gold;
        document.getElementById("kill-count").textContent = kills;
        document.getElementById("hp-fill-ui").style.width = (currentHP / maxHP * 100) + "%";
        document.getElementById("exp-fill").style.width = (exp / expNext * 100) + "%";
    }

    function gainExp(amount) {
        exp += amount;
        if (exp >= expNext) {
            levelUp();
        }
        updateUI();
    }

    function levelUp() {
        level++;
        exp = 0;
        expNext = Math.floor(expNext * 1.5); // Yêu cầu EXP tăng dần
        maxHP += 20;
        currentHP = maxHP; // Hồi đầy máu khi lên cấp
        baseDmg += 10;
        
        // Hiệu ứng chữ Level Up
        const txt = document.getElementById("lvl-up-text");
        txt.style.display = "block";
        setTimeout(() => txt.style.display = "none", 1500);
        updateUI();
    }

    function attackAction() {
        if (weaponDmg > 0) {
            weaponHand.classList.remove("swing-anim");
            void weaponHand.offsetWidth;
            weaponHand.classList.add("swing-anim");
        }
        
        const totalDmg = baseDmg + weaponDmg;
        mobs = mobs.filter(m => {
            if (Math.hypot(px - m.x, py - m.y) < 140) {
                m.hp -= totalDmg;
                showDmg(m.x, m.y, totalDmg);
                if (m.hp <= 0) {
                    m.el.remove();
                    gold += 30;
                    kills++;
                    gainExp(40); // Nhận 40 EXP mỗi quái
                    setTimeout(spawnOneSlime, 3000);
                    return false;
                }
            }
            return true;
        });
    }

    function spawnOneSlime() {
        const m = { x: 600 + Math.random()*1200, y: 600 + Math.random()*1200, hp: 40 + (level*10) };
        const el = document.createElement('div');
        el.className = 'entity mob';
        mobLayer.appendChild(el);
        m.el = el;
        mobs.push(m);
    }

    function showDmg(x, y, val) {
        const d = document.createElement("div");
        d.className = "dmg-popup";
        d.textContent = "-" + val;
        d.style.left = x + "px"; d.style.top = (y-20) + "px";
        map.appendChild(d);
        setTimeout(() => d.remove(), 600);
    }

    function buySword() {
        if (gold >= 200) {
            gold -= 200;
            weaponDmg = 60;
            weaponHand.style.display = "block";
            document.getElementById("shopUI").style.display = "none";
            updateUI();
        } else { alert("Không đủ vàng!"); }
    }

    // Logic di chuyển & Camera (Giữ nguyên từ bản trước)
    function update() {
        let mx = 0, my = 0;
        const speed = 7;
        if(keys.up) my -= speed; if(keys.down) my += speed;
        if(keys.left) { mx -= speed; player.style.transform = "scaleX(-1)"; }
        if(keys.right) { mx += speed; player.style.transform = "scaleX(1)"; }

        if(mx !== 0 || my !== 0) {
            px += mx; py += my;
            player.style.left = px + "px"; player.style.top = py + "px";
            map.style.transform = `translate(${window.innerWidth/2 - px - 40}px, ${window.innerHeight/2 - py - 40}px)`;
        }
        mobs.forEach(m => {
            m.el.style.left = m.x + "px"; m.el.style.top = m.y + "px";
            if(Math.hypot(px - m.x, py - m.y) < 50 && Math.random() < 0.01) {
                currentHP -= 2; updateUI();
                if(currentHP <= 0) { alert("Game Over!"); location.reload(); }
            }
        });
        document.querySelectorAll('.entity').forEach(el => el.style.zIndex = Math.floor(el.offsetTop));
        requestAnimationFrame(update);
    }

    // Controls PC & Mobile
    window.addEventListener("keydown", e => {
        const k = e.key.toLowerCase();
        if(k === "w" || e.key === "ArrowUp") keys.up = true;
        if(k === "s" || e.key === "ArrowDown") keys.down = true;
        if(k === "a" || e.key === "ArrowLeft") keys.left = true;
        if(k === "d" || e.key === "ArrowRight") keys.right = true;
        if(e.code === "Space") attackAction();
    });
    window.addEventListener("keyup", e => {
        const k = e.key.toLowerCase();
        if(k === "w" || e.key === "ArrowUp") keys.up = false;
        if(k === "s" || e.key === "ArrowDown") keys.down = false;
        if(k === "a" || e.key === "ArrowLeft") keys.left = false;
        if(k === "d" || e.key === "ArrowRight") keys.right = false;
    });

    // Joypad Mobile
    const joy = document.getElementById("joy"), stick = document.getElementById("stick");
    joy.addEventListener("touchstart", (e) => {
        const handleMove = (ev) => {
            const t = ev.touches[0];
            const r = joy.getBoundingClientRect();
            const dx = t.clientX - (r.left + r.width/2), dy = t.clientY - (r.top + r.height/2);
            const dist = Math.min(Math.hypot(dx, dy), 50), ang = Math.atan2(dy, dx);
            stick.style.transform = `translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist}px))`;
            keys.up = dy < -15; keys.down = dy > 15; keys.left = dx < -15; keys.right = dx > 15;
        };
        document.addEventListener("touchmove", handleMove);
        document.addEventListener("touchend", () => {
            keys = { up: false, down: false, left: false, right: false };
            stick.style.transform = "translate(-50%, -50%)";
            document.removeEventListener("touchmove", handleMove);
        }, {once: true});
    });

    document.getElementById("btnAttack").onclick = attackAction;
    document.getElementById("btnAction").onclick = () => { if(Math.hypot(px-920, py-680) < 150) document.getElementById("shopUI").style.display="flex"; };

    for(let i=0; i<8; i++) spawnOneSlime();
    updateUI(); update();
</script>
</body>
</html>
