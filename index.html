<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hỏa Long Mobile - Click to Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <style>
        :root { --accent: #ffd700; --ui-bg: rgba(0, 0, 0, 0.9); }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Arial', sans-serif; }
        body { width: 100%; height: 100%; overflow: hidden; background: #111; color: white; }
        
        #map { position: absolute; width: 3000px; height: 3000px; background: url('img/co.png') repeat; background-size: 80px; }
        .entity { position: absolute; transform-origin: bottom center; background-size: contain; background-repeat: no-repeat; background-position: center; z-index: 10; }
        
        /* Name Tag */
        .name-tag { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.6); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; white-space: nowrap; border: 1px solid rgba(255, 215, 0, 0.3); }
        .hp-bar { position: absolute; top: -10px; left: 5px; right: 5px; height: 4px; background: #333; border-radius: 2px; }
        .hp-fill { height: 100%; background: #ff4757; width: 100%; transition: width 0.1s; }

        #player { width: 50px; height: 50px; background-image: url('img/char1.png'); }
        #pet { width: 35px; height: 35px; background-image: url('img/smile.png'); filter: drop-shadow(0 0 5px gold); }
        #pet-weapon { position: absolute; width: 22px; height: 22px; background-image: url('img/vukhi.png'); right: -12px; bottom: 5px; display: none; }
        
        #npc-merchant { width: 50px; height: 50px; background-image: url('img/char3.png'); }
        #shop-bg { width: 100px; height: 100px; background-image: url('img/shop.png'); opacity: 0.8; }

        .mob { width: 45px; height: 45px; background-image: url('img/boss.png'); }
        .gold-drop { width: 20px; height: 20px; background: gold; border-radius: 50%; box-shadow: 0 0 10px gold; }

        /* Nút Tương Tác */
        #btn-interact { position: fixed; right: 40px; bottom: 160px; width: 70px; height: 70px; background: #e67e22; border: 3px solid white; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; z-index: 3000; box-shadow: 0 0 15px rgba(0,0,0,0.5); color: white; }

        /* UI Cửa hàng */
        #shop-ui { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .shop-box { background: #2c3e50; padding: 20px; border-radius: 15px; border: 3px solid var(--accent); text-align: center; width: 280px; }
.buy-btn { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-top: 15px; font-weight: bold; cursor: pointer; }

        #hud { position: fixed; top: 15px; left: 15px; z-index: 1000; }
        .stat-card { background: var(--ui-bg); padding: 8px 15px; border-radius: 10px; border: 2px solid var(--accent); color: gold; font-weight: bold; }
        
        #joy { position: fixed; left: 40px; bottom: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 2000; }
        #stick { position: absolute; width: 40px; height: 40px; background: white; border-radius: 50%; left: 30px; top: 30px; }
        /* Iframe chứa trang trang bị */
#equipment-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 9999;
    display: none; /* Mặc định ẩn */
}
    </style>
</head>
<body>

<div id="hud"><div class="stat-card">VÀNG: <span id="gold-txt">0</span></div></div>

<div id="btn-interact" onclick="openShop()">MUA ĐỒ</div>

<div id="viewport">
    <div id="map">
        <div id="shop-bg" class="entity" style="left: 1000px; top: 1100px;"></div>
        <div id="npc-merchant" class="entity" style="left: 1060px; top: 1150px;">
            <div class="name-tag" style="color:#ff9f43">Thợ Rèn (Char3)</div>
        </div>
        
        <div id="player" class="entity" style="left: 1200px; top: 1200px;"><div class="name-tag">Hỏa Long</div></div>
        <div id="pet" class="entity" style="left: 1160px; top: 1200px;">
            <div class="name-tag" style="color:#0f0">Tiểu Long</div>
            <div id="pet-weapon"></div>
        </div>
        <div id="mobs-layer"></div>
        <div id="drops-layer"></div>
    </div>
</div>

<div id="shop-ui">
    <div class="shop-box">
        <h3 style="color:var(--accent)">TIỆM RÈN KHÍ</h3>
        <p style="margin: 10px 0; font-size: 14px;">Nâng cấp Kiếm Thần (200 Vàng)<br><small>Tăng mạnh lực đánh cho Pet</small></p>
        <button class="buy-btn" id="buy-action" onclick="confirmPurchase()">XÁC NHẬN MUA</button>
        <button class="buy-btn" style="background:#c0392b; margin-top:10px" onclick="document.getElementById('shop-ui').style.display='none'">ĐÓNG</button>
    </div>
</div>

<div id="joy"><div id="stick"></div></div>
<iframe id="equipment-frame" src="more/trangbi.html"></iframe>
<script>
    const state = { px: 1200, py: 1200, petX: 1160, petY: 1200, gold: 0, atk: 20, hasWeapon: false, keys: {} };
    const map = document.getElementById("map"), pet = document.getElementById("pet"), player = document.getElementById("player");
    let mobs = [], drops = [];

    function spawnMob() {
        const m = { x: 800 + Math.random()*1000, y: 800 + Math.random()*1000, hp: 100, el: document.createElement('div') };
        m.el.className = 'entity mob';
m.el.innerHTML = `<div class="hp-bar"><div class="hp-fill"></div></div><div class="name-tag" style="color:red">Yêu Tinh</div>`;
        m.el.style.left = m.x + "px"; m.el.style.top = m.y + "px";
        document.getElementById("mobs-layer").appendChild(m.el);
        mobs.push(m);
    }

    // Logic Shop
    function openShop() { document.getElementById("shop-ui").style.display = "flex"; }
    
    function confirmPurchase() {
        if (state.gold >= 200 && !state.hasWeapon) {
            state.gold -= 200; state.atk = 50; state.hasWeapon = true;
            document.getElementById("gold-txt").innerText = state.gold;
            document.getElementById("pet-weapon").style.display = "block";
            document.getElementById("shop-ui").style.display = "none";
            alert("Nâng cấp vũ khí thành công!");
        } else if (state.hasWeapon) {
            alert("Đã sở hữu rồi!");
        } else {
            alert("Thiếu vàng rồi đại hiệp!");
        }
    }

    function loop() {
        // Di chuyển
        let mx = 0, my = 0, s = 6;
        if (state.keys['w']) my -= s; if (state.keys['s']) my += s;
        if (state.keys['a']) { mx -= s; player.style.transform = "scaleX(-1)"; }
        if (state.keys['d']) { mx += s; player.style.transform = "scaleX(1)"; }
        state.px += mx; state.py += my;
        player.style.left = state.px + "px"; player.style.top = state.py + "px";

        // Hiện nút bấm khi gần NPC
        const distToNPC = Math.hypot(state.px - 1060, state.py - 1150);
        document.getElementById("btn-interact").style.display = (distToNPC < 60) ? "flex" : "none";

        // Pet AI săn quái
        let target = mobs.reduce((prev, curr) => {
            let d = Math.hypot(state.px - curr.x, state.py - curr.y);
            return (d < 250 && (!prev || d < prev.dist)) ? {dist: d, mob: curr} : prev;
        }, null);

        if (target && !state.isAttacking) {
            state.petX += (target.mob.x - state.petX) * 0.15;
            state.petY += (target.mob.y - state.petY) * 0.15;
            if (Math.hypot(state.petX - target.mob.x, state.petY - target.mob.y) < 30) {
                state.isAttacking = true;
                target.mob.hp -= state.atk;
                target.mob.el.querySelector('.hp-fill').style.width = target.mob.hp + "%";
                if(target.mob.hp <= 0) {
                    const g = { x: target.mob.x, y: target.mob.y, el: document.createElement('div') };
                    g.el.className = 'entity gold-drop'; g.el.style.left = g.x+"px"; g.el.style.top = g.y+"px";
                    document.getElementById("drops-layer").appendChild(g.el); drops.push(g);
                    target.mob.el.remove(); mobs = mobs.filter(m => m !== target.mob); spawnMob();
                }
                setTimeout(() => state.isAttacking = false, 500);
            }
        } else {
            state.petX += (state.px - 40 - state.petX) * 0.1;
state.petY += (state.py + 10 - state.petY) * 0.1;
        }
        pet.style.left = state.petX + "px"; pet.style.top = state.petY + "px";

        // Nhặt vàng
        drops.forEach((d, i) => {
            if (Math.hypot(state.px - d.x, state.py - d.y) < 40) {
                d.el.remove(); drops.splice(i, 1);
                state.gold += 50; document.getElementById("gold-txt").innerText = state.gold;
            }
        });

        map.style.transform = `translate(${window.innerWidth/2 - state.px}px, ${window.innerHeight/2 - state.py}px)`;
        requestAnimationFrame(loop);
    }

    // Controls
    window.onkeydown = e => state.keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => state.keys[e.key.toLowerCase()] = false;
    document.getElementById("joy").ontouchmove = e => {
        let t = e.touches[0], r = document.getElementById("joy").getBoundingClientRect();
        let dx = t.clientX - (r.left + 50), dy = t.clientY - (r.top + 50);
        let d = Math.min(Math.hypot(dx, dy), 40), ang = Math.atan2(dy, dx);
        document.getElementById("stick").style.transform = `translate(${Math.cos(ang)*d}px, ${Math.sin(ang)*d}px)`;
        state.keys['w'] = dy < -15; state.keys['s'] = dy > 15; state.keys['a'] = dx < -15; state.keys['d'] = dx > 15;
    };
    document.getElementById("joy").ontouchend = () => { state.keys = {}; document.getElementById("stick").style.transform = "translate(0,0)"; };

    for(let i=0; i<5; i++) spawnMob();
    loop();
    // 1. Hàm mở trang bị
function openEquipment() {
    const frame = document.getElementById('equipment-frame');
    frame.style.display = 'block';
    // Load lại iframe để cập nhật dữ liệu mới nhất
    frame.contentWindow.location.reload();
}

// 2. Hàm đóng trang bị (gọi từ file trangbi.html)
function closeEquipment() {
    document.getElementById('equipment-frame').style.display = 'none';
}

// 3. Gán sự kiện click vào giữa nhân vật
player.onclick = function(e) {
    e.stopPropagation(); // Ngăn sự kiện click xuyên xuống map
    openEquipment();
};

// Đảm bảo nhân vật có thể nhận sự kiện click
player.style.pointerEvents = 'auto';
player.style.cursor = 'pointer';
</script>
</body>
</html>
